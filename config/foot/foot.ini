shell=zsh

#font=GitLab Mono:size=9.375
font=Google Sans Code NF:size=9.375, DejaVu Sans Mono:size=9.375
font-bold=Google Sans Code NF:style=Bold:size=9.375, DejaVu Sans Mono:style=Bold:size=9.375
font-italic=Google Sans Code NF:style=Regular Italic:size=9.375
line-height=11
letter-spacing=0
dpi-aware=no

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[colors-dark]
alpha=0.85
blur=yes

[mouse]
hide-when-typing=true
